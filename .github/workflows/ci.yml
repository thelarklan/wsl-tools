name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'

permissions:
  contents: read

jobs:
  windows-powershell:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install test tools
        shell: powershell
        run: |
          Install-Module Pester -Scope CurrentUser -Force -RequiredVersion 5.7.1
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Analyze PowerShell
        shell: powershell
        run: Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
      - name: Run Pester
        shell: powershell
        run: Invoke-Pester ./tests -CI

  powershell:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install test tools
        shell: pwsh
        run: |
          Install-Module Pester -Scope CurrentUser -Force -RequiredVersion 5.7.1
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Analyze PowerShell
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
      - name: Run Pester
        shell: pwsh
        run: Invoke-Pester ./tests -CI

  shell:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Bash syntax
        run: bash -n scripts/*.sh
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

  image-metadata:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check pinned Canonical image metadata
        shell: pwsh
        run: |
          Import-Module ./scripts/WslTools.psm1 -Force
          $config = Import-PowerShellDataFile ./config.psd1
          foreach ($check in @(Get-WslImageMetadataChecks $config)) {
            $sums = Invoke-RestMethod $check.Sha256SumsUrl
            if (-not (Test-WslImageMetadataEntry -Sha256Sums $sums -ExpectedLine $check.ExpectedLine)) {
              throw "Pinned Ubuntu $($check.UbuntuRelease) WSL image does not match Canonical SHA256SUMS."
            }
          }
